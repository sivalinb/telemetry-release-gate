name: Live Mac validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m venv .venv && .venv/bin/pip install -r requirements-dev.txt
      - run: .venv/bin/python scripts/run.py --live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-mac-evidence
          path: artifacts/*.json
